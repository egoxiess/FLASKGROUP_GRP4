<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selection Sort</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='selection_sort.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body style="background-color: #772244;">
    <div class="selection-container">
        <h1 class="selection-title">Selection Sort</h1>
        <p class="selection-note">(whole numbers only)</p>
        
        <div class="back-button-container">
            <a href="/works"><button class="button2">← Back</button></a>
        </div>
        
        <div class="input-section">
            <form class="controls">
                <input type="text" id="numberInput" placeholder="Enter a number" class="number-input">
                
                <button type="button" onclick="addNumber()" class="selection-btn">Add Number</button>
            </form>
            
            <div class="array-display" id="arrayDisplay">
                <div class="empty-message">No numbers yet. Add some numbers to begin!</div>
            </div>
            
            <div class="button-group">
                <button onclick="startSelectionSort()" class="selection-btn selection-btn-sort" id="sortBtn">
                    Selection Sort
                </button>
                <button onclick="resetArray()" class="selection-btn selection-btn-reset">
                    Reset
                </button>
            </div>
        </div>
        
        <div class="visualization" id="visualization"></div>
    </div>
    
    <script src="{{ url_for('static', filename='selection_sort.js') }}"></script>
</body>
</html>
